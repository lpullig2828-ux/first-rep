<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Rep</title>
<meta name="description" content="Feeling lost in the gym? A short workout plan, machine guides and quiet hours for UCCS students.">
<meta name="theme-color" content="#0F1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="First Rep">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
</style>
<style>
/* Layout: phone-width column, fixed tab bar. Black + loud gold hero; every gym area has its own bold color used everywhere it appears. */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F6F7FA; --ink:#0F1013; --muted:#585D68; --line:#E0E3EA;
  --gold:#FFC72C; --gold-ink:#8A6200; --gold-soft:#FFF2C7;
  --hero:#0F1013; --hero-fg:#FFFFFF; --hero-muted:#B4B7BF;
  --cardio:#E63E1C; --machine:#2563EB; --cable:#7C3AED; --free:#0A8F55; --stretch:#0891B2; --other:#B45309;
  --good:#0A8F55; --warn:#C27803; --bad:#DC2626; --on-color:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0B0D; --surface:#16181D; --surface-2:#1D2026; --ink:#F5F5F2; --muted:#A1A6B0; --line:#2A2E36;
  --gold:#FFC72C; --gold-ink:#FFD45C; --gold-soft:#2E2610;
  --hero:#1A1C22; --hero-fg:#FFFFFF; --hero-muted:#A9ADB6;
  --cardio:#FF5A36; --machine:#4D8BFF; --cable:#9F6BFF; --free:#22C27A; --stretch:#22B8D6; --other:#F59E0B;
  --good:#22C27A; --warn:#F5B02E; --bad:#FF5A5A; --on-color:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0B0D; --surface:#16181D; --surface-2:#1D2026; --ink:#F5F5F2; --muted:#A1A6B0; --line:#2A2E36;
  --gold:#FFC72C; --gold-ink:#FFD45C; --gold-soft:#2E2610;
  --hero:#1A1C22; --hero-fg:#FFFFFF; --hero-muted:#A9ADB6;
  --cardio:#FF5A36; --machine:#4D8BFF; --cable:#9F6BFF; --free:#22C27A; --stretch:#22B8D6; --other:#F59E0B;
  --good:#22C27A; --warn:#F5B02E; --bad:#FF5A5A; --on-color:#FFFFFF; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}
.app.no-tabs{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;margin:0;text-wrap:balance}
h1{font-size:2.6rem;text-transform:uppercase;font-style:italic;letter-spacing:-.005em}
h2{font-size:1.7rem;text-transform:uppercase;font-style:italic}
h3{font-size:1.3rem;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
p{margin:0}
a{color:var(--machine);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.hl{background:linear-gradient(transparent 58%,var(--gold) 58%);padding:0 .08em}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 4px}
.brand{font-family:var(--display);font-weight:800;font-style:italic;font-size:1.6rem;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--gold);display:grid;place-items:center;color:#0F1013;font-size:1.15rem;transform:skewX(-8deg)}
.top-right{display:flex;gap:8px;align-items:center}
.lvl-chip{border:0;background:var(--ink);color:var(--bg);border-radius:999px;height:36px;padding:0 12px 0 6px;font:700 .8rem var(--body);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.lvl-chip i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#0F1013;display:grid;place-items:center;font-size:.72rem;font-weight:800}
.circle-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;padding:0}
.circle-btn svg{width:18px;height:18px}
.back{border:0;background:none;color:var(--ink);font:700 .95rem var(--body);display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:6px 0}

/* buttons */
.btn{appearance:none;border:0;border-radius:14px;padding:16px 18px;font:800 1.05rem var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none;box-sizing:border-box;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--gold);color:#0F1013;box-shadow:0 6px 0 -2px color-mix(in srgb,var(--gold) 55%,#000)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--machine);outline-offset:2px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero > *{position:relative}
.hero::before{content:"";position:absolute;right:-30px;top:-30px;width:190px;height:190px;background:repeating-linear-gradient(-45deg,var(--gold) 0 10px,transparent 10px 22px);opacity:.22;border-radius:50%}
.hero .eyebrow{color:var(--gold)}
.hero h2{font-size:2.5rem;line-height:.92}
.hero .meta{color:var(--hero-muted);font-size:.9rem;display:flex;gap:6px 14px;flex-wrap:wrap}
.hero .meta b{color:var(--hero-fg)}
.hero-chips{display:flex;gap:6px;flex-wrap:wrap}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:var(--muted)}
.wd i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;color:#0F1013;box-sizing:border-box}
.wd.on i{background:var(--gold);border-color:var(--gold)}
.wd.today{color:var(--ink)}
.wd.today i{border-color:var(--ink)}
.wd.on.today i{border-color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted);font-weight:500;line-height:1.3}
.stat.c1 b{color:var(--cardio)} .stat.c2 b{color:var(--machine)} .stat.c3 b{color:var(--free)}

/* colored tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:var(--r);padding:16px 14px;text-align:left;cursor:pointer;color:var(--on-color);font:inherit;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;overflow:hidden;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile svg{width:28px;height:28px}
.tile b{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:1.35rem;line-height:1}
.tile span{font-size:.82rem;line-height:1.35;opacity:.92}
.tile::after{content:"";position:absolute;right:-22px;bottom:-22px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.14)}
.t-cardio{background:var(--cardio)} .t-machine{background:var(--machine)} .t-cable{background:var(--cable)} .t-free{background:var(--free)}

/* tip */
.tip{background:var(--gold-soft);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.tip .bulb{flex:none;width:34px;height:34px;border-radius:10px;background:var(--gold);display:grid;place-items:center;color:#0F1013}
.tip .bulb svg{width:18px;height:18px}
.tip b{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}

/* busy meter */
.meter{display:flex;align-items:flex-end;gap:3px;height:64px}
.meter i{flex:1;border-radius:4px 4px 1px 1px;min-height:4px;opacity:.35}
.meter i.q{background:var(--good)} .meter i.m{background:var(--warn)} .meter i.b{background:var(--bad)}
.meter i.now{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.meter-axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:800;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.quiet{color:var(--on-color);background:var(--good)}
.pill.moderate{color:#0F1013;background:var(--warn)}
.pill.busy{color:var(--on-color);background:var(--bad)}
.pill.closed{color:var(--muted);background:var(--surface-2)}

/* chips (area colors) */
.chip{display:inline-flex;align-items:center;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 7px;white-space:nowrap}
.a-cardio{--a:var(--cardio)} .a-machine{--a:var(--machine)} .a-cable{--a:var(--cable)} .a-free{--a:var(--free)} .a-stretch{--a:var(--stretch)} .a-other{--a:var(--other)}
.chip{color:var(--a,var(--muted));background:color-mix(in srgb,var(--a,var(--muted)) 15%,transparent)}
.hero .chip{background:rgba(255,255,255,.1);color:var(--hero-fg)}
.mchip{display:inline-flex;font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}

/* progress */
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .4s}
.hero .bar{background:rgba(255,255,255,.14)}

/* onboarding */
.ob{display:flex;flex-direction:column;gap:22px;padding-top:8px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--gold)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;font:inherit;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .12s}
.choice:active{transform:scale(.98)}
.choice .ic{width:46px;height:46px;border-radius:12px;background:var(--a,var(--gold));display:grid;place-items:center;flex:none;color:var(--on-color)}
.choice .ic svg{width:24px;height:24px}
.choice .ic.txt{font-family:var(--display);font-weight:800;font-size:1.5rem;font-style:italic}
.choice b{display:block;font-size:1.02rem}
.choice span span{display:block;font-size:.85rem;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--a,var(--gold));box-shadow:0 0 0 2px var(--a,var(--gold))}
.splash{display:flex;flex-direction:column;gap:18px;padding-top:6px}
.splash-hero{background:var(--hero);color:var(--hero-fg);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.splash-hero > *{position:relative}
.splash-hero::before{content:"";position:absolute;inset:auto -40px -60px auto;width:240px;height:240px;background:repeating-linear-gradient(-45deg,var(--gold) 0 12px,transparent 12px 26px);opacity:.2;border-radius:50%}
.splash-hero .eyebrow{color:var(--gold)}
.splash-hero h1{font-size:3.6rem;line-height:.88}
.splash-hero h1 em{font-style:italic;color:var(--gold)}
.splash-hero p{color:var(--hero-muted)}
.promise{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding:0;list-style:none}
.promise li{border-radius:14px;padding:12px 10px;color:var(--on-color);display:flex;flex-direction:column;gap:6px;font-size:.8rem;line-height:1.3;font-weight:500}
.promise li svg{width:22px;height:22px}
.promise li:nth-child(1){background:var(--machine)} .promise li:nth-child(2){background:var(--cardio)} .promise li:nth-child(3){background:var(--free)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;box-sizing:border-box;text-align:left;font:inherit;color:var(--ink);cursor:pointer;text-decoration:none}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .sub{font-size:.85rem;color:var(--muted);font-weight:400}
.chev{color:var(--muted);flex:none}
.check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--a,var(--line));flex:none;display:grid;place-items:center;color:transparent;box-sizing:border-box}
.check.on{background:var(--a,var(--gold));border-color:var(--a,var(--gold));color:var(--on-color)}
.mico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--a);color:var(--on-color)}
.mico svg{width:22px;height:22px}
.badge-day{font-family:var(--display);font-weight:800;font-style:italic;font-size:1.3rem;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line);color:var(--ink);flex:none;box-sizing:border-box}
.badge-day.done{background:var(--gold);border-color:var(--gold);color:#0F1013}
.badge-day.next{border-color:var(--ink)}

/* exercise rows */
.ex{border-top:1px solid var(--line);padding:16px;display:flex;gap:12px;align-items:flex-start}
.ex:first-child{border-top:0}
.ex .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ex .name{font-weight:800;font-size:1.02rem;line-height:1.25}
.ex .name.done{text-decoration:line-through;color:var(--muted)}
.ex .how{font-size:.88rem;color:var(--muted)}
.ex .amt{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1;font-variant-numeric:tabular-nums}
.ex button.check{cursor:pointer;background:none;padding:0;margin-top:2px}
.ex button.check.on{background:var(--a,var(--gold))}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.mini{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 .8rem var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;flex:none}
.mini svg{width:14px;height:14px}
.mini.done{background:var(--gold);border-color:var(--gold);color:#0F1013}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:15;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--hero);color:var(--hero-fg);box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.timer-in{max-width:480px;margin:0 auto;padding-block:14px;display:flex;align-items:center;gap:14px}
.timer .t{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold);min-width:84px}
.timer .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.timer .bar{background:rgba(255,255,255,.15)}
.timer button{border:1.5px solid rgba(255,255,255,.25);background:transparent;color:var(--hero-fg);border-radius:999px;padding:8px 12px;font:700 .8rem var(--body);cursor:pointer}
.timer.done .t{color:var(--good)}

/* machine guide */
.mhead{border-radius:22px;padding:22px 20px;color:var(--on-color);background:var(--a);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.mhead > *{position:relative}
.mhead::after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(255,255,255,.14)}
.mhead h1{font-size:2.8rem}
.mhead .eyebrow{color:rgba(255,255,255,.85)}
.mhead .mchip{background:rgba(255,255,255,.18);border-color:transparent;color:var(--on-color)}
.lvl-dots{display:inline-flex;gap:4px;align-items:center;font-size:.8rem;font-weight:700}
.lvl-dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
.lvl-dots i.on{background:var(--on-color)}
.video{aspect-ratio:16/9;max-width:100%;border-radius:var(--r);background:var(--hero);display:grid;place-items:center;text-align:center;color:var(--hero-muted);font-size:.85rem;padding:12px;box-sizing:border-box;position:relative;overflow:hidden}
.video .play{width:58px;height:58px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin:0 auto 8px;color:#0F1013}
.video b{display:block;color:var(--hero-fg);font-size:.95rem}
ol.num{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:n}
ol.num li{display:flex;gap:12px;align-items:flex-start;counter-increment:n}
ol.num li::before{content:counter(n);flex:none;width:26px;height:26px;border-radius:8px;background:var(--a,var(--ink));color:var(--a-fg,var(--bg));display:grid;place-items:center;font:800 .85rem var(--body)}
.cue-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cue{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;font-size:.88rem;min-width:0}
.cue b{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.callout{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1.5px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.callout b{color:var(--bad);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.callout.gold{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.callout.gold b{color:var(--gold-ink)}

/* phases */
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{border-radius:12px;padding:10px 8px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:3px;font-size:.74rem;line-height:1.25;min-width:0}
.ph b{font-family:var(--display);font-size:1.05rem;font-weight:800;text-transform:uppercase;font-style:italic;line-height:1}
.ph.past{opacity:.55}
.ph.cur{background:var(--gold);border-color:var(--gold);color:#0F1013}

/* challenges */
.lvl-card{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.lvl-card > *{position:relative}
.lvl-card::before{content:"";position:absolute;left:-40px;bottom:-70px;width:200px;height:200px;background:repeating-linear-gradient(45deg,var(--gold) 0 10px,transparent 10px 22px);opacity:.18;border-radius:50%}
.lvl-card .big{font-family:var(--display);font-weight:800;font-style:italic;font-size:2.6rem;line-height:.9;text-transform:uppercase;color:var(--gold)}
.lvl-card .eyebrow{color:var(--hero-muted)}
.lvl-card .small{color:var(--hero-muted)}
.lvl-card .bar{background:rgba(255,255,255,.14);height:10px}
.chal{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.chal:first-child{border-top:0}
.chal .grow{flex:1;min-width:0}
.chal .pts{font-size:.72rem;font-weight:800;color:var(--gold-ink)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.76rem;line-height:1.25;min-width:0}
.bdg .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-style:italic;font-size:1.35rem;background:var(--surface-2);border:2px dashed var(--line);color:var(--muted);box-sizing:border-box}
.bdg.on .medal{background:var(--a);border:0;color:var(--on-color);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 25%,transparent)}
.bdg b{font-size:.85rem}

/* hours table */
.hours{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.hours td{padding:9px 0;border-top:1px solid var(--line)}
.hours tr:first-child td{border-top:0}
.hours td:last-child{text-align:right}
.hours tr.today td{font-weight:800}
.hours tr.today td:first-child::after{content:"Today";margin-left:8px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#0F1013;border-radius:5px;padding:2px 6px}

/* explore */
.xcard{border-radius:var(--r);padding:18px 16px;color:var(--on-color);background:var(--a);display:flex;flex-direction:column;gap:8px;text-decoration:none;position:relative;overflow:hidden}
.xcard > *{position:relative}
.xcard::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.13)}
.xcard h3{font-size:1.5rem;font-style:italic;font-weight:800}
.xcard p{font-size:.9rem;opacity:.95}
.xcard .good{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.18);align-self:flex-start;border-radius:6px;padding:3px 8px}
.xcard .go{font-weight:800;font-size:.9rem}

/* glossary */
details{border-top:1px solid var(--line)}
details:first-child{border-top:0}
summary{padding:14px 16px;cursor:pointer;font-weight:800;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.3rem;color:var(--gold-ink);font-weight:800}
details[open] summary::after{content:"−"}
details p{padding:0 16px 14px;color:var(--muted);font-size:.9rem}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px}
.tab{background:none;border:0;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 .72rem var(--body);color:var(--muted);cursor:pointer;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{background:var(--gold);color:#0F1013;border-radius:999px;padding:3px 14px;box-sizing:content-box}

.foot{font-size:.75rem;color:var(--muted);text-align:center;padding-top:26px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.9rem;font-weight:700;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fade,.pop{animation:none}.toast,.btn,.tile,.choice,.bar i{transition:none}}
.big-num{font-family:var(--display);font-weight:800;font-style:italic;font-size:5.5rem;line-height:.85;color:var(--gold-ink)}
.done-hero{background:var(--gold);color:#0F1013;border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.done-hero > *{position:relative}
.done-hero::before{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:repeating-linear-gradient(-45deg,#0F1013 0 8px,transparent 8px 20px);opacity:.08;border-radius:50%}
.done-hero .big-num{color:#0F1013}
.done-hero .eyebrow{color:#0F1013;opacity:.7}
.done-hero h1{font-size:2.2rem}
.pts-pill{align-self:flex-start;background:#0F1013;color:var(--gold);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.9rem}
textarea.invite{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:.92rem;background:var(--surface);color:var(--ink);resize:vertical;box-sizing:border-box}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.daychips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dchip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 0;font:800 .74rem var(--body);cursor:pointer;min-width:0}
.dchip[aria-pressed="true"]{background:var(--machine);border-color:var(--machine);color:var(--on-color)}
.sel{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:500 .95rem var(--body);background:var(--surface);color:var(--ink)}
.cal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cal-btns .btn{font-size:.88rem;padding:13px 8px}
.conf{border-radius:var(--r);padding:16px;background:color-mix(in srgb,var(--machine) 9%,var(--surface));border:2px solid var(--machine)}
.conf .eyebrow{color:var(--machine)}
.conf-opts{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>

<script>
(()=>{
// ---------- config ----------
const APP_URL = location.origin + location.pathname; // the site's own address
const REC = "https://campusrec.uccs.edu";
const WELLNESS = "https://recwellness.uccs.edu";

// ---------- anonymous impact counting (GoatCounter: no cookies, no names) ----------
const GC_CODE = "firstrep-uccs"; // dashboard: https://firstrep-uccs.goatcounter.com
const GCQ = [];
let firstPV = true;
function gcSend(o){ try{ if(window.goatcounter && window.goatcounter.count){ window.goatcounter.count(o); } else { GCQ.push(o); } }catch(e){} }
function track(name){ gcSend({path:"event/"+name, title:name, event:true}); }
function pageview(v){ gcSend(Object.assign({path:"/"+v, title:v}, firstPV && SRC ? {referrer:"qr-"+SRC} : {})); firstPV=false; }
(function loadGC(){
  if(!/^https?:$/.test(location.protocol) || /claude|localhost|127\.0\.0\.1/.test(location.hostname)) return;
  window.goatcounter = { no_onload:true };
  const s=document.createElement("script"); s.async=true; s.src="https://gc.zgo.at/count.js";
  s.dataset.goatcounter=`https://${GC_CODE}.goatcounter.com/count`;
  s.onload=()=>{ while(GCQ.length) gcSend(GCQ.shift()); };
  document.head.appendChild(s);
})();

// ---------- storage (per-device) ----------
const KEY = "firstrep.v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const S = Object.assign({ profile:null, log:[], manual:{}, pack:{}, conf:{}, cal:false, calHide:false, src:"" }, load());
const QS = new URLSearchParams(location.search);
const SRC = (QS.get("utm_source")||QS.get("src")||"").toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,40);
if(SRC && !S.src){ S.src=SRC; save(); }
if(SRC) track("scan/"+SRC);
const srcTag = () => S.src || "direct";

// ---------- dates ----------
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function weekKey(d=new Date()){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return iso(x); }
const thisWeek = () => S.log.filter(l => weekKey(new Date(l.d+"T12:00")) === weekKey());
const reduceMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

// ---------- Rec hours (Fall 2026, campusrec.uccs.edu) ----------
const HOURS = { 0:[12,21], 1:[6,22], 2:[6,22], 3:[6,22], 4:[6,22], 5:[6,21], 6:[10,20] };
const DAYNAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const fmtH = h => h===12 ? "12 pm" : h===0||h===24 ? "12 am" : h<12 ? `${h} am` : `${h-12} pm`;
// Sample crowd pattern (0-100). Swap in real Rec headcounts when available.
const WEEKDAY_BUSY = {6:18,7:28,8:32,9:30,10:36,11:46,12:58,13:50,14:56,15:72,16:86,17:92,18:80,19:64,20:44,21:24};
const WEEKEND_BUSY = {10:30,11:42,12:50,13:55,14:52,15:48,16:44,17:38,18:30,19:22,20:16};
function busyFor(day,h){ const t = (day===0||day===6) ? WEEKEND_BUSY : WEEKDAY_BUSY; const [o,c]=HOURS[day]; return (h>=o && h<c) ? (t[h] ?? 20) : null; }
function level(v){ if(v===null) return ["closed","Closed now"]; if(v<45) return ["quiet","Quiet"]; if(v<70) return ["moderate","Moderate"]; return ["busy","Busy"]; }

// ---------- icons ----------
const sv = (p,w=2.2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {

// ---------- plan helpers ----------
function isEasy(){ return !!S.profile && !!S.profile.easy && S.profile.easy!=="no"; }
function comfort(){ const c=COMFORT.find(x=>x.id===(S.profile?.comfort||"new")); return isEasy() ? Object.assign({},c,{f:Math.min(c.f,1.3),ds:Math.min(c.ds,0)}) : c; }
function goalObj(){ return GOALS.find(x=>x.id===(S.profile?.goal||"start")); }
function planList(){ const p=S.profile||{goal:"start",days:3}; const w=isEasy()?W.gentle:W[p.goal]; return Array.from({length:p.days},(_,i)=>w[i % w.length]); }
function exAmt(e){
  const c=comfort();
  if(e.t){ const m = e.fixed ? e.t : Math.round(e.t*c.f); return `${m} min`; }
  const s=Math.max(1,e.s+c.ds); return `${s} × ${e.r}`;
}
function minutes(wk){ const c=comfort(); return Math.round(wk.ex.reduce((a,e)=> a + (e.t ? (e.fixed?e.t:e.t*c.f) : Math.max(1,e.s+c.ds)*2), 0)); }
function nextIndex(){ return Math.min(thisWeek().length, planList().length-1); }
function exMuscles(e){ return e.mu || (e.m ? MACHINES[e.m].mu : []); }
function weekNum(){ const st=S.profile?.since; if(!st) return 1; const days=Math.floor((Date.now()-new Date(st+"T00:00").getTime())/864e5); return Math.max(1,Math.floor(days/7)+1); }

// ---------- points, levels, badges ----------
function wkManual(){ return S.manual[weekKey()] || (S.manual[weekKey()]={}); }
function manualCount(){ return Object.values(S.manual).reduce((a,m)=>a+Object.values(m).filter(Boolean).length,0); }
function points(){ return S.log.length*100 + manualCount()*50; }
function lvlInfo(){
  const p=points(); let i=0; for(let k=0;k<LEVELS.length;k++) if(p>=LEVELS[k][0]) i=k;
  const next=LEVELS[i+1]; const pct = next ? (p-LEVELS[i][0])/(next[0]-LEVELS[i][0]) : 1;
  return {p, i, name:LEVELS[i][1], next, pct};
}
function weekStreak(){
  const set=new Set(S.log.map(l=>weekKey(new Date(l.d+"T12:00"))));
  let n=0; const d=new Date(); if(!set.has(weekKey(d))) d.setDate(d.getDate()-7);
  while(set.has(weekKey(d))){ n++; d.setDate(d.getDate()-7); }
  return n;
}
function hitWeekEver(){ const by={}; S.log.forEach(l=>{const k=weekKey(new Date(l.d+"T12:00")); by[k]=(by[k]||0)+1;}); return Object.values(by).some(v=>v>=(S.profile?.days||3)); }
function badges(){
  const total=S.log.length, ever = id => Object.values(S.manual).some(m=>m[id]);
  return [
    {n:"First Rep",l:"Finish your first workout",on:total>=1,m:"1",a:"cardio"},
    {n:"Five Up",l:"5 workouts done",on:total>=5,m:"5",a:"machine"},
    {n:"Ten Strong",l:"10 workouts done",on:total>=10,m:"10",a:"free"},
    {n:"Full Week",l:"Hit your weekly goal",on:hitWeekEver(),m:"W",a:"cable"},
    {n:"Buddy Up",l:"Bring a friend",on:ever("buddy"),m:"2",a:"stretch"},
    {n:"Explorer",l:"Try the climbing wall or a class",on:ever("class")||ever("climb"),m:"X",a:"other"},
  ];
}

function calInfo(){
  const c=calState(), now=new Date(); let st=null;

}

// ---------- rest timer ----------
const $timer=document.getElementById("timer"); let T=null;
function startTimer(sec,label){
  clearInterval(T?.iv); T={end:Date.now()+sec*1000,total:sec,label};
  $timer.hidden=false; $timer.classList.remove("done"); T.iv=setInterval(drawTimer,250); drawTimer();
}
function drawTimer(){
  if(!T) return; const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  const fin=left===0; if(fin){ clearInterval(T.iv); $timer.classList.add("done"); setTimeout(()=>{ if(T&&Date.now()>=T.end){ stopTimer(); } },4000); }
  $timer.innerHTML=`<div class="timer-in"><span class="t">${fin?"GO":`${Math.floor(left/60)}:${pad(left%60)}`}</span>
    <div class="grow"><b>${fin?"Rest done. Next set!":"Resting"}</b><span style="opacity:.75">${T.label}</span><div class="bar"><i style="width:${(1-left/T.total)*100}%"></i></div></div>
    ${fin?"":`<button data-act="t-add">+15s</button>`}<button data-act="t-stop">${fin?"Close":"Skip"}</button></div>`;
}
function stopTimer(){ if(T) clearInterval(T.iv); T=null; $timer.hidden=true; }

// ---------- confetti ----------
function confetti(){
  if(reduceMotion()) return;
  const c=document.createElement("canvas"); c.id="confetti"; document.body.appendChild(c);
  const ctx=c.getContext && c.getContext("2d"); if(!ctx){ c.remove(); return; }
  const W_=c.width=innerWidth*devicePixelRatio, H_=c.height=innerHeight*devicePixelRatio;
  const cs=getComputedStyle(document.documentElement), cols=["--gold","--cardio","--machine","--free","--cable","--stretch"].map(v=>cs.getPropertyValue(v).trim()||"#FFC72C");
  const P=Array.from({length:140},()=>({x:W_/2+(Math.random()-.5)*W_*.3,y:H_*.35,vx:(Math.random()-.5)*26*devicePixelRatio,vy:(-Math.random()*22-8)*devicePixelRatio,s:(6+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function frame(t){ ctx.clearRect(0,0,W_,H_); P.forEach(p=>{ p.vy+=.7*devicePixelRatio; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(t-t0<2200) requestAnimationFrame(frame); else c.remove(); })(t0);
}

// ---------- router ----------
const TABS={home:"home",plan:"plan",machines:"machines",challenges:"challenges"};
function route(){
  let h=(location.hash||"").slice(1);
  if(!S.profile && !h) h="start";
  if(!S.profile && ["home","plan","workout","challenges","done"].includes(h)) h="start";
  let html;
  if(h.startsWith("machine-")) html=V.machine(h.slice(8));
  else if(V[h] && !h.startsWith("_")) html=V[h]();
  else html=V.home();
  const noTabs = !S.profile || ["start","done","workout"].includes(h);
  $tabs.hidden=noTabs; $app.classList.toggle("no-tabs",noTabs);
  $app.innerHTML=html;
  const t = h.startsWith("machine-") ? "machines" : (TABS[h]||(h===""?"home":""));
  document.querySelectorAll(".tab").forEach(b=>b.removeAttribute("aria-current"));
  if(t) document.querySelector(`.tab[data-go="${t}"]`)?.setAttribute("aria-current","page");
  if(h!=="workout") stopTimer();
  const target = V._scrollTo && document.getElementById(V._scrollTo); V._scrollTo=null;
  try{ if(target) target.scrollIntoView({block:"start"}); else window.scrollTo(0,0); }catch(e){}
  trackView(h);
}
let lastView=null;
function trackView(h){ const v=h||"home"; if(v===lastView) return; lastView=v; pageview(v); }
function keepScroll(){ const y=window.scrollY; route(); try{ window.scrollTo(0,y); }catch(e){} }
document.addEventListener("change",e=>{ if(e.target.id==="cal-time"){ calState().time=+e.target.value; keepScroll(); } });
function go(h){ if(location.hash==="#"+h) route(); else location.hash=h; }
window.addEventListener("hashchange",route);

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

let resetArmed=false;
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){ e.preventDefault(); const to=g.dataset.go; if(to==="workout"){ V._wk=undefined; S.pack.ck=[]; save(); } go(to); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act;
  if(act==="ob-next"){ V._step=1; route(); }
  else if(act==="ob-skip"){ S.profile={goal:"start",comfort:"new",days:3,easy:"no",since:iso(new Date())}; save(); track("look-around/"+srcTag()); go("home"); }
  else if(act==="ob-back"){ V._step=Math.max(0,(V._step||0)-1); route(); }
  else if(act==="ob-pick"){
    const k=a.dataset.k, v=a.dataset.v; V._draft[k]= k==="days"? +v : v;
    if(V._step<4){ V._step++; route(); }
    else {
      const isNew=!S.profile;
      S.profile={...V._draft, since:V._draft.since||iso(new Date())}; V._step=0; V._draft=null; V._cal=null; save();
      if(isNew){ track("plan-created/"+srcTag()); track("goal/"+S.profile.goal); }
      if(isEasy()) track("low-impact/"+S.profile.easy);
      go("home"); toast("Your plan is ready");
    }
  }
  else if(act==="redo"){ V._step=1; V._draft={...(S.profile||{})}; go("start"); }
  else if(act==="open-wk"){ V._wk=+a.dataset.i; S.pack.ck=[]; save(); go("workout"); }
  else if(act==="tick"){ const k=+a.dataset.k; S.pack.ck=S.pack.ck||[]; S.pack.ck[k]=!S.pack.ck[k]; save(); const y=window.scrollY; route(); try{window.scrollTo(0,y);}catch(err){} }
  else if(act==="rest"){ startTimer(+a.dataset.sec, a.dataset.label); }
  else if(act==="t-add"){ if(T){ T.end+=15000; T.total+=15; drawTimer(); } }
  else if(act==="t-stop"){ stopTimer(); }
  else if(act==="finish"){
    const before=badges().filter(b=>b.on).map(b=>b.n);
    const i=V._wk ?? nextIndex(), wk=planList()[i];
    S.log.push({d:iso(new Date()), w:wk.n, min:minutes(wk)}); S.pack.ck=[]; V._wk=undefined; save();
    track("workout-finished");
    if(S.log.length===1) track("first-workout/"+srcTag());
    if(S.log.length===5) track("fifth-workout/"+srcTag());
    const nb=badges().find(b=>b.on && !before.includes(b.n)); V._newBadge=nb?nb.n:null; go("done"); confetti();
  }
  else if(act==="rate"){
    const v=+a.dataset.v, order=["new","some","comfy"], cur=order.indexOf(S.profile.comfort||"new");
    const nx=Math.max(0,Math.min(2,cur+v)); S.profile.comfort=order[nx]; save();
    toast(v===0?"Got it. Same next time.":nx===cur?"You're already at that level.":v>0?"Next workouts will be a bit longer.":"Next workouts will be a bit shorter.");
    go("home");
  }
  else if(act==="chal"){ const m=wkManual(), id=a.dataset.id; m[id]=!m[id]; save(); route(); if(m[id]){ toast("+50 Pride points"); } }
  else if(act==="pack"){ const k="p"+a.dataset.k; S.pack[k]=!S.pack[k]; save(); const y=window.scrollY; route(); try{window.scrollTo(0,y);}catch(err){} }
  else if(act==="conf"){ S.conf[a.dataset.k]=a.dataset.v; save(); track(`confidence-${a.dataset.k}/${a.dataset.v}`); keepScroll(); toast("Thanks for answering"); }
  else if(act==="cal-day"){ const c=calState(), d=a.dataset.d; c.days = c.days.includes(d) ? c.days.filter(x=>x!==d) : [...c.days,d]; c.days.sort((x,y)=>DAY_ORDER.indexOf(x)-DAY_ORDER.indexOf(y)); keepScroll(); }
  else if(act==="cal-ics"){ addCalendar("ics"); }
  else if(act==="cal-google"){ addCalendar("google"); }
  else if(act==="cal-open"){ V._scrollTo="cal"; go("plan"); }
  else if(act==="cal-hide"){ S.calHide=true; save(); keepScroll(); }
  else if(act==="copy"){
    const ta=document.getElementById("invite"), txt=ta.value;
    const fallback=()=>{ ta.focus(); ta.select(); toast("Selected. Copy it from your keyboard menu."); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Invite copied. Paste it in a text."),fallback); }catch(err){ fallback(); }
  }
  else if(act==="reset"){
    if(!resetArmed){ resetArmed=true; document.getElementById("reset-note").hidden=false; a.textContent="Yes, reset everything"; return; }
    try{ localStorage.removeItem(KEY); }catch(err){} location.hash=""; location.reload();
  }
});

route();
})();
</script>

</html>
